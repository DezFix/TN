<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заметки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#2AABEE;
    --accent-dk:#1E96D6;
    --bg:#FFFFFF;
    --bg-list:#FFFFFF;
    --bg-chat:#EDF2F5;
    --bubble-own:#E4F3FF;
    --bubble-own-border:#D3EAFB;
    --text:#0F1721;
    --text-soft:#7C8A97;
    --text-faint:#A9B4BE;
    --divider:#E6E9EC;
    --danger:#E05353;
    --row-active:#F5F7F9;
    --modal-bg:#FFFFFF;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #app[data-theme="dark"]{
    --accent:#4EA4F6;
    --accent-dk:#71B8F8;
    --bg:#1C232C;
    --bg-list:#1C232C;
    --bg-chat:#262E39;
    --bubble-own:#2F4A63;
    --bubble-own-border:#3A5772;
    --text:#EDF1F5;
    --text-soft:#A2ACB6;
    --text-faint:#717B85;
    --divider:#323B46;
    --danger:#F07575;
    --row-active:#28313C;
    --modal-bg:#262E39;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background-color:#B9C3CB;
    font-family:var(--font);
    color:var(--text);
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    height:100vh;
    background:var(--bg);
    position:relative;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,0.15);
  }
  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
  }
  #listScreen{ z-index:1; }
  #chatScreen{ z-index:2; transform:translateX(100%); background:var(--bg-chat); }
  #chatScreen.open{ transform:translateX(0); }
  #settingsScreen{ z-index:3; transform:translateX(100%); background:var(--bg); }
  #settingsScreen.open{ transform:translateX(0); }

  /* ---------- LIST SCREEN ---------- */
  .topbar{
    flex:none;
    padding:14px 12px 10px 12px;
    background:var(--bg);
    border-bottom:1px solid var(--divider);
  }
  .topbar-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .topbar-side{ width:34px; flex:none; }
  .topbar h1{
    font-size:19px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
    text-align:center;
    flex:1;
  }
  .icon-round{
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:var(--bg-chat);
    color:var(--text-soft);
    font-size:15px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex:none;
  }
  .icon-round:hover{ filter:brightness(0.95); }
  #searchBox{
    width:100%;
    font-family:var(--font);
    font-size:14.5px;
    padding:9px 12px;
    border:none;
    border-radius:10px;
    background:var(--bg-chat);
    color:var(--text);
    outline:none;
  }
  #searchBox::placeholder{ color:var(--text-faint); }

  #chatList{
    flex:1;
    overflow-y:auto;
    background:var(--bg-list);
  }
  .chat-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 16px;
    cursor:pointer;
    border-bottom:1px solid var(--divider);
  }
  .chat-row:active{ background:var(--row-active); }
  .avatar{
    flex:none;
    width:50px;height:50px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    font-size:19px;
    font-weight:600;
  }
  .avatar.emoji{ font-size:23px; }
  .chat-info{ flex:1; min-width:0; }
  .chat-info-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .chat-name{ font-size:15.5px; font-weight:600; color:var(--text); }
  .chat-time{ font-size:12px; color:var(--text-faint); flex:none; }
  .chat-preview{ display:flex; justify-content:space-between; align-items:center; margin-top:2px; }
  .chat-snippet{
    font-size:13.5px; color:var(--text-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:88%;
  }
  .chat-badge{
    flex:none; background:var(--accent); color:#fff; font-size:11px; font-weight:600;
    min-width:19px; height:19px; border-radius:10px;
    display:flex;align-items:center;justify-content:center; padding:0 5px;
  }
  .empty-list{ padding:60px 30px; text-align:center; color:var(--text-faint); font-size:14px; line-height:1.6; }

  .fab{
    position:absolute; right:18px; bottom:22px;
    width:56px;height:56px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; font-size:24px;
    box-shadow:0 4px 14px rgba(42,171,238,0.45); cursor:pointer;
    display:flex;align-items:center;justify-content:center; z-index:5;
  }
  .fab:hover{ background:var(--accent-dk); }

  /* ---------- CHAT SCREEN ---------- */
  .chat-topbar{
    flex:none; display:flex; align-items:center; gap:10px;
    padding:10px 14px; background:var(--bg); border-bottom:1px solid var(--divider);
  }
  .back-btn{ background:none; border:none; font-size:22px; color:var(--accent); cursor:pointer; padding:2px 4px; line-height:1; }
  .chat-topbar .avatar{ width:36px; height:36px; font-size:14px; cursor:pointer; }
  .chat-topbar .avatar.emoji{ font-size:17px; }
  .chat-topbar-title{ font-size:16px; font-weight:600; }
  .chat-topbar-sub{ font-size:12px; color:var(--text-faint); }
  .chat-topbar-right{ margin-left:auto; display:flex; gap:2px; }
  .chat-topbar-btn{ background:none; border:none; color:var(--text-faint); font-size:17px; cursor:pointer; padding:4px 6px; }
  .chat-topbar-btn:hover{ color:var(--accent); }

  #messages{ flex:1; overflow-y:auto; padding:14px 12px 10px 12px; display:flex; flex-direction:column; gap:6px; }
  .day-pill{
    align-self:center; background:rgba(127,140,152,0.16); color:var(--text-soft);
    font-size:11.5px; font-weight:500; padding:4px 11px; border-radius:10px; margin:8px 0;
  }
  .msg{
    align-self:flex-end; max-width:78%; background:var(--bubble-own);
    border:1px solid var(--bubble-own-border); border-radius:14px 14px 3px 14px;
    padding:7px 9px 6px 10px; position:relative; box-shadow:0 1px 1px rgba(0,0,0,0.03);
  }
  .msg-text{ font-size:14.5px; line-height:1.42; white-space:pre-wrap; word-break:break-word; padding-right:44px; color:var(--text); }
  .msg-text .hashtag{ color:var(--accent-dk); font-weight:600; }
  .msg-time{ position:absolute; right:9px; bottom:6px; font-size:10.5px; color:var(--text-faint); }
  .msg-img{ border-radius:10px; overflow:hidden; line-height:0; position:relative; }
  .msg-img img{ width:100%; display:block; max-height:320px; object-fit:cover; }
  .msg-img .msg-time{ color:#fff; background:rgba(0,0,0,0.4); padding:1px 6px; border-radius:8px; bottom:6px; right:6px; }
  .msg-audio{ display:flex; align-items:center; gap:8px; padding-right:6px; }
  .msg-audio audio{ height:32px; width:180px; }
  .msg-file{ display:flex; align-items:center; gap:9px; min-width:180px; padding-right:40px; }
  .msg-file .ic{ width:32px;height:32px; border-radius:50%; background:var(--accent); color:#fff; display:flex;align-items:center;justify-content:center; font-size:14px; flex:none; }
  .msg-file .fname{ font-size:13px; font-weight:500; }
  .msg-file .fmeta{ font-size:11px; color:var(--text-faint); }
  .msg-del{
    position:absolute; left:-26px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--text-faint); font-size:13px; cursor:pointer;
    opacity:0; transition:opacity .15s;
  }
  .msg:hover .msg-del{ opacity:1; }
  .empty-chat{ margin:auto; text-align:center; color:var(--text-faint); font-size:13.5px; padding:0 40px; line-height:1.6; }

  /* ---------- COMPOSER ---------- */
  #composer{ flex:none; padding:8px 10px calc(10px + env(safe-area-inset-bottom)) 10px; background:var(--bg); border-top:1px solid var(--divider); }
  .rec-banner{ display:none; align-items:center; gap:8px; font-size:12.5px; color:var(--danger); padding:0 4px 8px 4px; }
  .rec-banner.show{ display:flex; }
  .rec-dot{ width:8px;height:8px;border-radius:50%;background:var(--danger); animation:pulse 1s infinite; }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  .composer-row{ display:flex; align-items:flex-end; gap:6px; }
  .comp-btn{ flex:none; width:38px;height:38px; border-radius:50%; border:none; background:none; color:var(--text-soft); font-size:19px; display:flex;align-items:center;justify-content:center; cursor:pointer; }
  .comp-btn:hover{ color:var(--accent); }
  #textInput{
    flex:1; font-family:var(--font); font-size:14.5px; padding:9px 14px; border:none;
    border-radius:18px; background:var(--bg-chat); color:var(--text); resize:none;
    max-height:110px; line-height:1.4; outline:none;
  }
  .send-circle{ flex:none; width:38px;height:38px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:16px; display:flex;align-items:center;justify-content:center; cursor:pointer; }
  .send-circle:hover{ background:var(--accent-dk); }
  .send-circle.mic.active{ background:var(--danger); }

  #fileInput, #videoInput{ display:none; }

  /* ---------- SETTINGS SCREEN ---------- */
  .settings-section{ padding:18px 16px 4px 16px; }
  .settings-label{ font-size:12px; font-weight:600; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin:0 0 8px 2px; }
  .settings-card{ background:var(--bg-chat); border-radius:12px; overflow:hidden; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 14px; }
  .settings-row + .settings-row{ border-top:1px solid var(--bg); }
  .settings-row-label{ font-size:14.5px; }
  .theme-toggle{
    display:flex; background:var(--bg); border-radius:9px; padding:3px; gap:2px;
  }
  .theme-opt{
    border:none; background:none; padding:6px 14px; border-radius:7px; font-family:var(--font);
    font-size:13px; font-weight:600; color:var(--text-soft); cursor:pointer;
  }
  .theme-opt.active{ background:var(--accent); color:#fff; }
  .settings-hint{ font-size:12px; color:var(--text-faint); padding:8px 16px 0 16px; line-height:1.5; }

  /* ---------- MODAL ---------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(15,23,33,0.4); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-backdrop.open{ display:flex; }
  .modal{ background:var(--modal-bg); border-radius:14px; padding:20px; width:100%; max-width:320px; box-shadow:0 20px 50px rgba(0,0,0,0.3); }
  .modal h3{ font-size:16px; margin:0 0 14px 0; font-weight:700; color:var(--text); }
  .modal input[type=text]{
    width:100%; font-family:var(--font); font-size:14px; padding:10px 12px; border:1px solid var(--divider);
    border-radius:8px; outline:none; margin-bottom:14px; background:var(--bg); color:var(--text);
  }
  .modal input[type=text]:focus{ border-color:var(--accent); }
  .field-label{ font-size:11.5px; font-weight:600; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; margin:0 0 8px 1px; }
  .color-picker{ display:flex; gap:9px; margin-bottom:16px; flex-wrap:wrap; }
  .swatch{ width:28px;height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .swatch.selected{ border-color:var(--text); }
  .icon-picker{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .icon-opt{
    width:34px;height:34px; border-radius:9px; background:var(--bg-chat); border:2px solid transparent;
    font-size:17px; display:flex;align-items:center;justify-content:center; cursor:pointer;
  }
  .icon-opt.selected{ border-color:var(--accent); background:var(--bg); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; }
  .btn{ font-family:var(--font); font-weight:600; font-size:13px; padding:8px 14px; border-radius:8px; border:none; background:var(--bg-chat); cursor:pointer; color:var(--text-soft); }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn.danger-text{ color:var(--danger); }

  #errorToast{
    position:fixed; left:50%; top:14px; transform:translateX(-50%) translateY(-140%);
    background:#3A2020; color:#FFD9D9; border:1px solid #6B3535;
    font-family:var(--font); font-size:12.5px; line-height:1.4;
    padding:10px 14px; border-radius:10px; max-width:90%; width:400px;
    box-shadow:0 8px 24px rgba(0,0,0,0.3); z-index:999;
    transition:transform .25s ease;
  }
  #errorToast.show{ transform:translateX(-50%) translateY(0); }

  /* ---------- MESSAGE CONTEXT MENU ---------- */
  .ctx-menu{
    position:fixed; z-index:200; background:var(--modal-bg);
    border-radius:11px; box-shadow:0 10px 30px rgba(0,0,0,0.35);
    padding:6px; min-width:180px; display:none;
  }
  .ctx-menu.show{ display:block; }
  .ctx-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:7px;
    cursor:pointer; font-size:14px; color:var(--text); font-family:var(--font);
  }
  .ctx-item:hover{ background:var(--row-active); }
  .ctx-item .ctx-ic{ width:18px; text-align:center; font-size:14px; flex:none; }
  .ctx-item.danger{ color:var(--danger); }
  .ctx-menu-backdrop{ position:fixed; inset:0; z-index:199; display:none; }
  .ctx-menu-backdrop.show{ display:block; }

  .msg.editing .msg-text{ display:none; }
  .msg-edit-box{ display:none; }
  .msg.editing .msg-edit-box{ display:block; }
  .msg-edit-box textarea{
    width:100%; min-width:200px; font-family:var(--font); font-size:14.5px; line-height:1.42;
    border:1px solid var(--accent); border-radius:8px; padding:6px 8px; resize:none;
    background:var(--bg); color:var(--text); outline:none;
  }
  .msg-edit-actions{ display:flex; justify-content:flex-end; gap:6px; margin-top:6px; }
  .msg-edit-actions button{
    font-family:var(--font); font-size:12px; font-weight:600; border:none; border-radius:6px;
    padding:5px 10px; cursor:pointer;
  }
  .msg-edit-actions .save-btn{ background:var(--accent); color:#fff; }
  .msg-edit-actions .cancel-btn{ background:var(--bg-chat); color:var(--text-soft); }
</style>
</head>
<body>
<div id="errorToast"></div>
<div class="ctx-menu-backdrop" id="ctxBackdrop"></div>
<div class="ctx-menu" id="ctxMenu"></div>
<div class="modal-backdrop" id="forwardBackdrop">
  <div class="modal">
    <h3>Переслать в…</h3>
    <div id="forwardList" style="display:flex; flex-direction:column; gap:4px; max-height:280px; overflow-y:auto; margin-bottom:14px;"></div>
    <div class="modal-actions">
      <button class="btn" id="cancelForward">Отмена</button>
    </div>
  </div>
</div>
<div id="app">

  <!-- LIST SCREEN -->
  <div class="screen" id="listScreen">
    <div class="topbar">
      <div class="topbar-row">
        <span class="topbar-side"></span>
        <h1>Заметки</h1>
        <button class="icon-round topbar-side" id="settingsBtn" title="Настройки">⚙</button>
      </div>
      <input id="searchBox" type="text" placeholder="Поиск по чатам и записям">
    </div>
    <div id="chatList"></div>
    <button class="fab" id="fabAdd" title="Новый чат заметок">✎</button>
  </div>

  <!-- CHAT SCREEN -->
  <div class="screen" id="chatScreen">
    <div class="chat-topbar">
      <button class="back-btn" id="backBtn">‹</button>
      <div class="avatar" id="chatAvatar"></div>
      <div>
        <div class="chat-topbar-title" id="chatTitle"></div>
        <div class="chat-topbar-sub" id="chatSub">заметки самому себе</div>
      </div>
      <div class="chat-topbar-right">
        <button class="chat-topbar-btn" id="editChatBtn" title="Изменить чат">✎</button>
        <button class="chat-topbar-btn" id="deleteChatBtn" title="Удалить чат">🗑</button>
      </div>
    </div>
    <div id="messages"></div>
    <div id="composer">
      <div class="rec-banner" id="recBanner"><span class="rec-dot"></span><span id="recTimer">Запись · 0:00</span></div>
      <div class="composer-row">
        <button class="comp-btn" id="attachBtn" title="Фото">📎</button>
        <button class="comp-btn" id="videoBtn" title="Видео">🎬</button>
        <textarea id="textInput" rows="1" placeholder="Сообщение…"></textarea>
        <button class="send-circle mic" id="sendBtn" title="Отправить">🎙</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS SCREEN -->
  <div class="screen" id="settingsScreen">
    <div class="chat-topbar">
      <button class="back-btn" id="settingsBackBtn">‹</button>
      <div class="chat-topbar-title">Настройки</div>
    </div>
    <div class="settings-section">
      <div class="settings-label">Оформление</div>
      <div class="settings-card">
        <div class="settings-row">
          <span class="settings-row-label">Тема</span>
          <div class="theme-toggle">
            <button class="theme-opt" id="themeLight">Светлая</button>
            <button class="theme-opt" id="themeDark">Тёмная</button>
          </div>
        </div>
      </div>
      <div class="settings-hint">Иконку, цвет и название каждого чата можно менять — откройте чат и нажмите ✎ рядом с его названием.</div>
    </div>
  </div>

</div>

<input type="file" id="fileInput" accept="image/*">
<input type="file" id="videoInput" accept="video/*">

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">Новый чат заметок</h3>
    <input type="text" id="newChatName" placeholder="Название, например «Идеи»">
    <div class="field-label">Иконка</div>
    <div class="icon-picker" id="iconPicker"></div>
    <div class="field-label">Цвет</div>
    <div class="color-picker" id="colorPicker"></div>
    <div class="modal-actions">
      <button class="btn" id="cancelChat">Отмена</button>
      <button class="btn primary" id="saveChat">Создать</button>
    </div>
  </div>
</div>

<script>
(function(){
  function showError(msg){
    const el = document.getElementById('errorToast');
    el.textContent = '⚠ ' + msg;
    el.classList.add('show');
    clearTimeout(showError._t);
    showError._t = setTimeout(() => el.classList.remove('show'), 5000);
  }
  function isBenignNoise(msg){
    return /ResizeObserver loop/i.test(msg || '');
  }
  window.addEventListener('error', e => { if(!isBenignNoise(e.message)) showError('Ошибка: ' + (e.message || 'что-то пошло не так')); });
  window.addEventListener('unhandledrejection', e => {
    const msg = e.reason && e.reason.message ? e.reason.message : '';
    if(!isBenignNoise(msg)) showError('Ошибка: ' + (msg || 'не получилось выполнить действие'));
  });

  const COLORS = ['#2AABEE','#E0663E','#7C5CD6','#3EA66E','#D6538B','#C99A2E','#5C7CFA','#20B2AA'];
  const ICONS = [null,'💡','📌','💼','🎯','📚','🎨','🎧','🍳','✈️','🌱','⚡','🧠','❤️','🏋️','🎵'];
  const STORAGE_KEY = 'tg-notes-data-v2';

  let state = {
    theme: 'light',
    chats: [
      {id:'c_saved', name:'Избранное', color:'#2AABEE', icon:null},
      {id:'c_ideas', name:'Идеи', color:'#C99A2E', icon:'💡'},
      {id:'c_work', name:'Работа', color:'#3EA66E', icon:'💼'},
    ],
    entries: []
  };

  let currentChatId = null;
  let editingChatId = null; // null = creating new chat in modal
  let searchQuery = '';
  let mediaRecorder = null, recordedChunks = [], recStart = 0, recTimerInt = null;
  let selectedColor = COLORS[0];
  let selectedIcon = ICONS[0];

  const appEl = document.getElementById('app');
  const chatListEl = document.getElementById('chatList');
  const messagesEl = document.getElementById('messages');
  const chatScreen = document.getElementById('chatScreen');
  const settingsScreen = document.getElementById('settingsScreen');
  const textInput = document.getElementById('textInput');
  const searchBox = document.getElementById('searchBox');

  // ---------- persistence ----------
  async function loadData(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        if(parsed.chats) state.chats = parsed.chats;
        if(parsed.entries) state.entries = parsed.entries;
        if(parsed.theme) state.theme = parsed.theme;
      }
    }catch(e){ /* fresh start */ }
    applyTheme();
    renderChatList();
  }
  async function saveData(){
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
    catch(e){ console.error('Не удалось сохранить', e); showError('Не удалось сохранить изменения. Возможно, вложение слишком большое.'); }
  }

  // ---------- theme ----------
  function applyTheme(){
    appEl.setAttribute('data-theme', state.theme);
    document.getElementById('themeLight').classList.toggle('active', state.theme === 'light');
    document.getElementById('themeDark').classList.toggle('active', state.theme === 'dark');
  }
  document.getElementById('themeLight').onclick = () => { state.theme='light'; applyTheme(); saveData(); };
  document.getElementById('themeDark').onclick = () => { state.theme='dark'; applyTheme(); saveData(); };
  document.getElementById('settingsBtn').onclick = () => settingsScreen.classList.add('open');
  document.getElementById('settingsBackBtn').onclick = () => settingsScreen.classList.remove('open');

  // ---------- helpers ----------
  function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){ return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function renderTextWithTags(text){ return escapeHtml(text).replace(/#[\wа-яА-ЯёЁ]+/g, m => `<span class="hashtag">${m}</span>`); }
  function fmtTime(ts){ return new Date(ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}); }
  function fmtDay(ts){
    const d = new Date(ts), today = new Date();
    if(d.toDateString() === today.toDateString()) return 'Сегодня';
    const yest = new Date(today); yest.setDate(yest.getDate()-1);
    if(d.toDateString() === yest.toDateString()) return 'Вчера';
    return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'long'});
  }
  function chatById(id){ return state.chats.find(c => c.id === id); }
  function entriesFor(chatId){ return state.entries.filter(e => e.chatId === chatId).sort((a,b) => a.ts-b.ts); }
  function initials(name){ return name.trim().slice(0,1).toUpperCase(); }
  function avatarContent(chat){ return chat.icon ? chat.icon : initials(chat.name); }
  function avatarClass(chat){ return chat.icon ? 'avatar emoji' : 'avatar'; }

  function fileToCompressedDataUrl(file, maxW){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / img.width);
          const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function blobToDataUrl(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // ---------- CHAT LIST ----------
  function renderChatList(){
    chatListEl.innerHTML = '';
    const q = searchQuery.toLowerCase();
    let chats = state.chats.slice();
    if(q){
      chats = chats.filter(c => {
        const nameMatch = c.name.toLowerCase().includes(q);
        const entryMatch = entriesFor(c.id).some(e => (e.text||'').toLowerCase().includes(q) || (e.tags||[]).some(t=>t.includes(q)));
        return nameMatch || entryMatch;
      });
    }
    if(chats.length === 0){ chatListEl.innerHTML = '<div class="empty-list">Ничего не найдено</div>'; return; }

    chats.sort((a,b) => {
      const la = entriesFor(a.id).slice(-1)[0], lb = entriesFor(b.id).slice(-1)[0];
      return (lb ? lb.ts : 0) - (la ? la.ts : 0);
    });

    chats.forEach(chat => {
      const entries = entriesFor(chat.id);
      const last = entries[entries.length-1];
      const row = document.createElement('div');
      row.className = 'chat-row';
      row.innerHTML = `
        <div class="${avatarClass(chat)}" style="background:${chat.color}">${avatarContent(chat)}</div>
        <div class="chat-info">
          <div class="chat-info-top">
            <span class="chat-name">${escapeHtml(chat.name)}</span>
            <span class="chat-time">${last ? fmtTime(last.ts) : ''}</span>
          </div>
          <div class="chat-preview">
            <span class="chat-snippet">${last ? previewFor(last) : 'Нет записей'}</span>
            ${entries.length ? `<span class="chat-badge">${entries.length}</span>` : ''}
          </div>
        </div>`;
      row.onclick = () => openChat(chat.id);
      chatListEl.appendChild(row);
    });
  }

  function previewFor(entry){
    if(entry.type === 'text') return escapeHtml(entry.text.slice(0,60));
    if(entry.type === 'image') return '📷 Фото';
    if(entry.type === 'audio') return '🎙 Голосовое, ' + (entry.duration||0) + ' сек';
    if(entry.type === 'video') return '🎬 Видео';
    return '';
  }

  // ---------- CHAT DETAIL ----------
  function openChat(id){
    currentChatId = id;
    renderChatHeader();
    chatScreen.classList.add('open');
    renderMessages();
  }
  function renderChatHeader(){
    const chat = chatById(currentChatId);
    const av = document.getElementById('chatAvatar');
    av.className = avatarClass(chat);
    av.style.background = chat.color;
    av.textContent = avatarContent(chat);
    document.getElementById('chatTitle').textContent = chat.name;
  }
  function closeChat(){ chatScreen.classList.remove('open'); currentChatId = null; renderChatList(); }
  document.getElementById('backBtn').onclick = closeChat;

  document.getElementById('deleteChatBtn').onclick = () => {
    if(!currentChatId) return;
    if(state.chats.length <= 1){ alert('Нужен хотя бы один чат.'); return; }
    if(confirm('Удалить чат и все записи в нём?')){
      state.entries = state.entries.filter(e => e.chatId !== currentChatId);
      state.chats = state.chats.filter(c => c.id !== currentChatId);
      saveData();
      closeChat();
    }
  };

  function renderMessages(){
    const entries = entriesFor(currentChatId);
    messagesEl.innerHTML = '';
    if(entries.length === 0){
      messagesEl.innerHTML = '<div class="empty-chat">Пока пусто. Напишите текст, прикрепите фото или запишите голосовую заметку — она появится здесь.</div>';
      return;
    }
    let lastDay = null;
    entries.forEach(entry => {
      const day = fmtDay(entry.ts);
      if(day !== lastDay){
        const pill = document.createElement('div');
        pill.className = 'day-pill';
        pill.textContent = day;
        messagesEl.appendChild(pill);
        lastDay = day;
      }
      messagesEl.appendChild(renderMessage(entry));
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderMessage(entry){
    const msg = document.createElement('div');
    msg.className = 'msg';
    msg.dataset.id = entry.id;

    if(entry.type === 'text'){
      msg.innerHTML = `
        <div class="msg-text">${renderTextWithTags(entry.text)}</div>
        <span class="msg-time">${fmtTime(entry.ts)}</span>
        <div class="msg-edit-box">
          <textarea rows="2">${escapeHtml(entry.text)}</textarea>
          <div class="msg-edit-actions">
            <button class="cancel-btn">Отмена</button>
            <button class="save-btn">Сохранить</button>
          </div>
        </div>`;
    } else if(entry.type === 'image'){
      msg.classList.add('msg-img'); msg.style.padding='0'; msg.style.border='none';
      msg.innerHTML = `<img src="${entry.media}" alt="фото"><span class="msg-time">${fmtTime(entry.ts)}</span>`;
    } else if(entry.type === 'audio'){
      msg.innerHTML = `<div class="msg-audio"><audio controls src="${entry.media}"></audio></div><span class="msg-time" style="position:static; display:block; text-align:right; margin-top:2px;">${fmtTime(entry.ts)}</span>`;
    } else if(entry.type === 'video'){
      msg.innerHTML = `
        <div class="msg-file">
          <div class="ic">▶</div>
          <div><div class="fname">${escapeHtml(entry.mediaName)}</div><div class="fmeta">${entry.mediaSize} · превью не сохраняется в тесте</div></div>
        </div>
        <span class="msg-time">${fmtTime(entry.ts)}</span>`;
    }

    attachMessageGestures(msg, entry);

    if(entry.type === 'text'){
      const cancelBtn = msg.querySelector('.cancel-btn');
      const saveBtn = msg.querySelector('.save-btn');
      const ta = msg.querySelector('.msg-edit-box textarea');
      cancelBtn.onclick = () => msg.classList.remove('editing');
      saveBtn.onclick = () => {
        const newText = ta.value.trim();
        if(!newText) return;
        entry.text = newText;
        entry.tags = extractTags(newText);
        saveData();
        renderMessages();
        renderChatList();
      };
    }

    return msg;
  }

  function attachMessageGestures(msg, entry){
    let pressTimer = null, moved = false, startX = 0, startY = 0;
    const LONG_PRESS_MS = 420;

    msg.addEventListener('pointerdown', e => {
      if(e.button === 2) return; // handled by contextmenu
      moved = false;
      startX = e.clientX; startY = e.clientY;
      pressTimer = setTimeout(() => {
        if(!moved) openCtxMenu(entry, msg, e.clientX, e.clientY);
      }, LONG_PRESS_MS);
    });
    msg.addEventListener('pointermove', e => {
      if(Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8){
        moved = true;
        clearTimeout(pressTimer);
      }
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev => {
      msg.addEventListener(ev, () => clearTimeout(pressTimer));
    });
    msg.addEventListener('contextmenu', e => {
      e.preventDefault();
      openCtxMenu(entry, msg, e.clientX, e.clientY);
    });
  }

  // ---------- context menu ----------
  const ctxMenu = document.getElementById('ctxMenu');
  const ctxBackdrop = document.getElementById('ctxBackdrop');

  function closeCtxMenu(){
    ctxMenu.classList.remove('show');
    ctxBackdrop.classList.remove('show');
  }
  ctxBackdrop.onclick = closeCtxMenu;

  function openCtxMenu(entry, msgEl, x, y){
    const items = [];
    if(entry.type === 'text'){
      items.push({label:'Копировать', icon:'⧉', action:() => {
        navigator.clipboard && navigator.clipboard.writeText(entry.text).catch(()=>{});
      }});
      items.push({label:'Изменить', icon:'✎', action:() => {
        msgEl.classList.add('editing');
        const ta = msgEl.querySelector('.msg-edit-box textarea');
        if(ta){ ta.focus(); ta.selectionStart = ta.value.length; }
      }});
    }
    items.push({label:'Переслать', icon:'↪', action:() => openForwardModal(entry)});
    items.push({label:'Удалить', icon:'🗑', danger:true, action:() => {
      if(confirm('Удалить запись?')){
        state.entries = state.entries.filter(e => e.id !== entry.id);
        saveData();
        renderMessages();
        renderChatList();
      }
    }});

    ctxMenu.innerHTML = items.map((it, i) => `
      <div class="ctx-item${it.danger ? ' danger':''}" data-i="${i}">
        <span class="ctx-ic">${it.icon}</span><span>${it.label}</span>
      </div>`).join('');
    ctxMenu.querySelectorAll('.ctx-item').forEach((el, i) => {
      el.onclick = () => { closeCtxMenu(); items[i].action(); };
    });

    ctxMenu.style.left = '0px'; ctxMenu.style.top = '0px';
    ctxMenu.classList.add('show');
    ctxBackdrop.classList.add('show');
    const rect = ctxMenu.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    let left = Math.min(x, vw - rect.width - 12);
    let top = Math.min(y, vh - rect.height - 12);
    left = Math.max(12, left); top = Math.max(12, top);
    ctxMenu.style.left = left + 'px';
    ctxMenu.style.top = top + 'px';
  }

  // ---------- forward ----------
  const forwardBackdrop = document.getElementById('forwardBackdrop');
  const forwardList = document.getElementById('forwardList');
  document.getElementById('cancelForward').onclick = () => forwardBackdrop.classList.remove('open');
  forwardBackdrop.onclick = e => { if(e.target === forwardBackdrop) forwardBackdrop.classList.remove('open'); };

  function openForwardModal(entry){
    forwardList.innerHTML = '';
    state.chats.forEach(chat => {
      const row = document.createElement('div');
      row.className = 'chat-row';
      row.style.borderBottom = 'none';
      row.style.borderRadius = '10px';
      row.innerHTML = `<div class="${avatarClass(chat)}" style="background:${chat.color}">${avatarContent(chat)}</div><div class="chat-name">${escapeHtml(chat.name)}</div>`;
      row.onclick = () => {
        const copy = Object.assign({}, entry, {id: uid('e'), ts: Date.now(), chatId: chat.id});
        state.entries.push(copy);
        saveData();
        forwardBackdrop.classList.remove('open');
        if(chat.id === currentChatId) renderMessages();
        renderChatList();
        showError('Переслано в «' + chat.name + '»');
      };
      forwardList.appendChild(row);
    });
    forwardBackdrop.classList.add('open');
  }

  // ---------- add entries ----------
  async function addEntry(entry){
    entry.id = uid('e'); entry.ts = Date.now(); entry.chatId = currentChatId;
    if(!entry.tags) entry.tags = [];
    state.entries.push(entry);
    renderMessages();
    await saveData();
  }
  function extractTags(text){ const m = text.match(/#[\wа-яА-ЯёЁ]+/g) || []; return [...new Set(m.map(t => t.slice(1).toLowerCase()))]; }
  function addTextEntry(){
    const text = textInput.value.trim();
    if(!text || !currentChatId) return;
    addEntry({type:'text', text, tags:extractTags(text)});
    textInput.value=''; textInput.style.height='auto'; updateSendButton();
  }
  async function addImageEntry(file){
    if(!currentChatId) return;
    try{ addEntry({type:'image', media: await fileToCompressedDataUrl(file, 640)}); }
    catch(e){ alert('Не получилось прикрепить фото.'); }
  }
  async function addVideoEntry(file){
    if(!currentChatId) return;
    addEntry({type:'video', mediaName:file.name, mediaSize:(file.size/1024/1024).toFixed(1)+' МБ'});
  }
  async function addAudioEntry(blob, seconds){
    if(!currentChatId) return;
    try{ addEntry({type:'audio', media: await blobToDataUrl(blob), duration:seconds}); }
    catch(e){ alert('Не получилось сохранить запись.'); }
  }

  // ---------- composer ----------
  const sendBtn = document.getElementById('sendBtn');
  function updateSendButton(){
    const has = textInput.value.trim().length > 0;
    sendBtn.classList.toggle('mic', !has);
    sendBtn.textContent = has ? '➤' : '🎙';
  }
  textInput.addEventListener('input', () => {
    textInput.style.height='auto'; textInput.style.height = Math.min(textInput.scrollHeight,110)+'px';
    updateSendButton();
  });
  textInput.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); addTextEntry(); } });
  sendBtn.onclick = () => { if(textInput.value.trim().length>0){ addTextEntry(); } else { toggleRecording(); } };

  document.getElementById('attachBtn').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = e => { const f=e.target.files[0]; if(f) addImageEntry(f); e.target.value=''; };
  document.getElementById('videoBtn').onclick = () => document.getElementById('videoInput').click();
  document.getElementById('videoInput').onchange = e => { const f=e.target.files[0]; if(f) addVideoEntry(f); e.target.value=''; };

  // ---------- audio recording ----------
  const recBanner = document.getElementById('recBanner');
  const recTimer = document.getElementById('recTimer');
  async function toggleRecording(){
    if(mediaRecorder && mediaRecorder.state==='recording'){ mediaRecorder.stop(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => { if(e.data.size>0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, {type:'audio/webm'});
        const seconds = Math.round((Date.now()-recStart)/1000);
        addAudioEntry(blob, seconds);
        stream.getTracks().forEach(t => t.stop());
        sendBtn.classList.remove('active'); recBanner.classList.remove('show'); clearInterval(recTimerInt);
      };
      mediaRecorder.start(); recStart = Date.now();
      sendBtn.classList.add('active'); recBanner.classList.add('show');
      recTimerInt = setInterval(() => {
        const s = Math.round((Date.now()-recStart)/1000);
        const m = Math.floor(s/60), sec = String(s%60).padStart(2,'0');
        recTimer.textContent = `Запись · ${m}:${sec}`;
      }, 250);
    }catch(e){ alert('Нет доступа к микрофону. Разрешите доступ в браузере для голосовых заметок.'); }
  }

  // ---------- search ----------
  searchBox.addEventListener('input', () => { searchQuery = searchBox.value.trim(); renderChatList(); });

  // ---------- chat modal (create + edit) ----------
  const modalBackdrop = document.getElementById('modalBackdrop');
  const colorPicker = document.getElementById('colorPicker');
  const iconPicker = document.getElementById('iconPicker');
  const modalTitle = document.getElementById('modalTitle');
  const newChatName = document.getElementById('newChatName');
  const saveChatBtn = document.getElementById('saveChat');

  function buildColorPicker(){
    colorPicker.innerHTML = '';
    COLORS.forEach(c => {
      const sw = document.createElement('div');
      sw.className = 'swatch' + (c===selectedColor ? ' selected':'');
      sw.style.background = c;
      sw.onclick = () => { selectedColor=c; buildColorPicker(); };
      colorPicker.appendChild(sw);
    });
  }
  function buildIconPicker(){
    iconPicker.innerHTML = '';
    ICONS.forEach(ic => {
      const btn = document.createElement('div');
      btn.className = 'icon-opt' + (ic===selectedIcon ? ' selected':'');
      btn.textContent = ic ? ic : 'Aa';
      btn.style.fontSize = ic ? '17px' : '12px';
      btn.style.fontWeight = ic ? '400' : '700';
      btn.onclick = () => { selectedIcon=ic; buildIconPicker(); };
      iconPicker.appendChild(btn);
    });
  }

  function openChatModal(editId){
    editingChatId = editId || null;
    if(editingChatId){
      const chat = chatById(editingChatId);
      modalTitle.textContent = 'Изменить чат';
      saveChatBtn.textContent = 'Сохранить';
      newChatName.value = chat.name;
      selectedColor = chat.color;
      selectedIcon = chat.icon;
    } else {
      modalTitle.textContent = 'Новый чат заметок';
      saveChatBtn.textContent = 'Создать';
      newChatName.value = '';
      selectedColor = COLORS[Math.floor(Math.random()*COLORS.length)];
      selectedIcon = null;
    }
    buildColorPicker();
    buildIconPicker();
    modalBackdrop.classList.add('open');
    newChatName.focus();
  }

  document.getElementById('fabAdd').onclick = () => openChatModal(null);
  document.getElementById('editChatBtn').onclick = () => openChatModal(currentChatId);
  document.getElementById('cancelChat').onclick = () => modalBackdrop.classList.remove('open');
  modalBackdrop.onclick = e => { if(e.target===modalBackdrop) modalBackdrop.classList.remove('open'); };

  saveChatBtn.onclick = () => {
    const name = newChatName.value.trim();
    if(!name) return;
    if(editingChatId){
      const chat = chatById(editingChatId);
      chat.name = name; chat.color = selectedColor; chat.icon = selectedIcon;
      renderChatHeader();
      renderChatList();
      saveData();
    } else {
      const chat = {id:uid('c'), name, color:selectedColor, icon:selectedIcon};
      state.chats.push(chat);
      saveData();
      modalBackdrop.classList.remove('open');
      openChat(chat.id);
      return;
    }
    modalBackdrop.classList.remove('open');
  };

  loadData();
})();
</script>
</body>
