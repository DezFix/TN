name: Build releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release

      - name: Rename APKs
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir out
          cp build/app/outputs/flutter-apk/app-release.apk            "out/TN-$V-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/TN-$V-arm64.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk    "out/TN-$V-x86_64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: out/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Zip exe
        shell: pwsh
        run: |
          $V = "${env:GITHUB_REF_NAME}" -replace '^v',''
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "TN-$V-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: TN-*-windows-x64.zip

  release:
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
