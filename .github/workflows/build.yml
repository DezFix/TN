name: Build releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4

      - name: Install NDK 29 for whisper_ggml
        run: |
          echo "Installing NDK 29.0.14206865 for whisper_ggml..."
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;29.0.14206865" || $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865" || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865" || true
          ls -la $ANDROID_SDK_ROOT/ndk 2>/dev/null || ls -la $ANDROID_HOME/ndk 2>/dev/null || echo "NDK dir check done"

      - run: flutter pub get
      - run: flutter test
      - name: Restore release keystore
        run: |
          echo "${{ secrets.TN_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/tn-release.jks"
      - name: Build APKs (release-signed)
        env:
          TN_STORE_FILE: ${{ runner.temp }}/tn-release.jks
          TN_STORE_PASS: ${{ secrets.TN_STORE_PASS }}
          TN_KEY_PASS: ${{ secrets.TN_KEY_PASS }}
          TN_KEY_ALIAS: ${{ secrets.TN_KEY_ALIAS }}
        run: |
          flutter build apk --release --split-per-abi --dart-define=TN_GDRIVE_CLIENT_ID=${{ secrets.TN_GDRIVE_CLIENT_ID }} --dart-define=TN_GDRIVE_CLIENT_SECRET=${{ secrets.TN_GDRIVE_CLIENT_SECRET }}
          flutter build apk --release --dart-define=TN_GDRIVE_CLIENT_ID=${{ secrets.TN_GDRIVE_CLIENT_ID }} --dart-define=TN_GDRIVE_CLIENT_SECRET=${{ secrets.TN_GDRIVE_CLIENT_SECRET }}

      - name: Rename APKs
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir out
          cp build/app/outputs/flutter-apk/app-release.apk            "out/TN-$V-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/TN-$V-arm64.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk    "out/TN-$V-x86_64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: out/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=TN_GDRIVE_CLIENT_ID=${{ secrets.TN_GDRIVE_CLIENT_ID }} --dart-define=TN_GDRIVE_CLIENT_SECRET=${{ secrets.TN_GDRIVE_CLIENT_SECRET }}

      - name: Zip exe
        shell: pwsh
        run: |
          $V = "${env:GITHUB_REF_NAME}" -replace '^v',''
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "TN-$V-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: TN-*-windows-x64.zip

  release:
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: out

      # The app shows the release body as its "What's new" dialog — extract
      # this tag's section from CHANGELOG.md (## [X.Y.Z] … until next ## [).
      - name: Extract changelog for the release body
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v ver="## [$V]" '
            index($0, ver) == 1 {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "TN $GITHUB_REF_NAME" > release-body.md
          fi
          cat release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: release-body.md
          fail_on_unmatched_files: true
